# =============================================================================
# ingress.yaml
#
# PURPOSE:
#   Expose the retail-store UI service to the internet via an
#   Application Load Balancer (ALB) managed by the AWS Load Balancer Controller.
#
# HOW IT WORKS (beginner explanation):
#   1. You apply this file with 'kubectl apply -f k8s/ingress.yaml'.
#   2. The AWS Load Balancer Controller (installed in kube-system) sees this
#      Ingress resource and automatically provisions an ALB in your VPC.
#   3. The ALB gets a public DNS name like:
#        k8s-retailapp-xxxx.us-east-1.elb.amazonaws.com
#   4. Traffic coming to that DNS on port 80 is forwarded to the "ui" pod
#      on port 8080.
#
# IMPORTANT: Replace the 'host' value below with your actual domain once
#            you have the ALB DNS name (or use Route 53 to point a domain at it).
# =============================================================================

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-store-ingress
  namespace: retail-app
  labels:
    app.kubernetes.io/name: retail-store
    project: karatu-2025-capstone
  annotations:
    # Tell Kubernetes to use the AWS Load Balancer Controller
    kubernetes.io/ingress.class: alb

    # Create an internet-facing ALB (public IP) so users can reach it
    alb.ingress.kubernetes.io/scheme: internet-facing

    # Route traffic directly to pod IPs (recommended for EKS)
    alb.ingress.kubernetes.io/target-type: ip

    # Health check settings -- ALB checks this path to know if pods are healthy
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"

    # Tag the ALB with project metadata
    alb.ingress.kubernetes.io/tags: "project=karatu-2025-capstone,student_id=alt-soe-2025-350"

    # Listen on HTTP port 80
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

spec:
  rules:
    # Remove the 'host' field to accept ALL traffic regardless of domain name.
    # Once you have a real domain, add: host: yourapp.example.com
    - http:
        paths:
          # Route ALL traffic ( / and everything under it) to the ui service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui               # name of the Kubernetes Service for the frontend
                port:
                  number: 8080         # the port the ui container listens on
